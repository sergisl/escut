[project]
name = "escut"
version = "0.2.0"
description = "Scalar BVP solver utilities for screening mechanisms (chameleon, Vainshtein, Phaedrus)."
authors = [{ name = "sergisl" }]
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.20",
  "scipy>=1.8",
  "matplotlib>=3.5",
]

[project.urls]
Homepage = "https://github.com/sergisl/escut"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# The 'main' directory is the package root for 'escut'. Both lines are needed:
# without an explicit `packages`, setuptools auto-discovers every top-level
# directory (archive/, assets/, notebooks/, ...) and ships them as packages.
package-dir = {"escut" = "main"}
packages = ["escut"]


[project.optional-dependencies]
dev = [
  "pytest>=8",
]

